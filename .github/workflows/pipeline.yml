name: Daily job watcher

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect sources and rebuild data
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
        run: python -m jobwatcher.pipeline --date "$(date -u +%F)"
      - name: Close previous issues and open today's issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for issue in $(gh issue list --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --reason completed || true
          done
          gh issue create --title "$(date -u +%F)" --body-file data/processed/issue.md
      - name: Commit daily artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed site/data
          git commit -m "daily job snapshot $(date -u +%F)" || echo "No data changes to commit"
          git push

