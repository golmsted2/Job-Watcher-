name: Daily job watcher

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect sources and rebuild data
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
        run: python -m jobwatcher.pipeline --date "$(date -u +%F)"
      - name: Send optional email alerts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
        run: python -m jobwatcher.alerts
      - name: Close previous issues and open today's issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for issue in $(gh issue list --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --reason completed || true
          done
          issue_body_file="$(mktemp)"
          trap 'rm -f "$issue_body_file"' EXIT
          ISSUE_BODY_FILE="$issue_body_file" python - <<'PY'
          import os
          from pathlib import Path

          source = Path("data/processed/issue.md").read_text(encoding="utf-8")
          limit = 60000
          if len(source) > limit:
              source = source[:limit].rsplit("\n", 1)[0]
              source += "\n\n> The issue body was truncated to stay within GitHub's size limit. The full report is in the repository artifacts.\n"
          Path(os.environ["ISSUE_BODY_FILE"]).write_text(source, encoding="utf-8")
          PY
          gh issue create --title "$(date -u +%F)" --body-file "$issue_body_file"
      - name: Commit daily artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed data/history.csv data/status.json site/data
          git commit -m "daily job snapshot $(date -u +%F)" || echo "No data changes to commit"
          git push

